[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mechdesign"
version = "0.1.0"
description = "Four-bar linkage analysis and spur gear-train design tools"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["mechdesign"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
